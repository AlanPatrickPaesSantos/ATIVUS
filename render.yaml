packages:
  sigat-backend@0.0.0:
    type: web
    name: ativus-backend
    env: node
    plan: free
    repo: alanpatrickpaessantos/ativus
    branch: master
    rootDirectory: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: ALLOWED_ORIGINS
        value: ""
  sigat-frontend@0.0.0:
    type: web
    name: ativus-frontend
    env: node
    plan: free
    repo: alanpatrickpaessantos/ativus
    branch: master
    rootDirectory: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:spa
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ativus.onrender.com/api/v1
      - key: VITE_ENABLE_MSW
        value: "false"
      - key: DIST_DIR
        value: dist
    # Web Service: o spaStaticServer.js (http nativo) serve o dist e faz
    # fallback SPA (/* -> /index.html para rotas sem extensao). Deep links
    # como /dashboard, /relatorios e /administracao funcionam em refresh.